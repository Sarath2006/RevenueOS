services:
  postgres:
    image: postgres:16-alpine
    container_name: revenueos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Asarath@2006
      POSTGRES_DB: revenueos
    ports:
      - "5432:5432"
    volumes:
      - revenueos_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: revenueos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - revenueos_redis:/data

volumes:
  revenueos_postgres:
  revenueos_redis: